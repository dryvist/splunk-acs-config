# PR validation runs through a main-branch Build validation policy.
trigger: none

schedules:
  - cron: '0 0 * * *'
    branches:
      include:
        - main
    always: true

parameters:
  - name: environment
    displayName: Environment - all, or one name from environments.toml (pull runs envs in turn, push one job per env)
    type: string
    default: all
  - name: action
    displayName: Action - plan = compare only, pull = read live into a pull request, push = write files to the stack
    type: string
    default: plan
    values:
      - plan
      - pull
      - push
  - name: types
    displayName: Object types - all, or ';'-separated; see wiki Object types
    type: string
    default: all
  - name: check
    displayName: Fail plan when differences are found
    type: boolean
    default: false
  - name: names
    displayName: Object names - all, or ';'-separated stanza names (index, token, feature, port, role or app)
    type: string
    default: all
  - name: delete
    displayName: Delete objects that exist only in the stack (push only; deleting an index deletes its data)
    type: boolean
    default: false

resources:
  repositories:
    - repository: tools
      type: git
      name: splunk-acs-config

extends:
  template: templates/acs-config.yml@tools
  parameters:
    # Edit the environments to match environments.toml.
    environments:
      - nonprod
      - prod
    environment: ${{ parameters.environment }}
    action: ${{ parameters.action }}
    types: ${{ parameters.types }}
    check: ${{ parameters.check }}
    names: ${{ parameters.names }}
    delete: ${{ parameters.delete }}
    pool:
      name: <agent-pool>
