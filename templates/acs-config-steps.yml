parameters:
  - name: env
    type: string
  - name: action
    type: string
  - name: types
    type: string
    default: all
  - name: names
    type: string
    default: all
  - name: delete
    type: boolean
    default: false

steps:
  - checkout: self
    path: config
    persistCredentials: ${{ eq(parameters.action, 'pull') }}
  - checkout: tools
    path: tools
  - task: UsePythonVersion@0
    displayName: Select Python 3.13
    inputs:
      versionSpec: "3.13"
  - script: python "$(Pipeline.Workspace)/tools/acs_config.py" ${{ parameters.action }} ${{ parameters.env }} --dir "$(Pipeline.Workspace)/config" --types "${{ parameters.types }}" --names "${{ parameters.names }}" ${{ iif(parameters.delete, '--delete', '') }}
    displayName: ${{ format('{0} {1}', parameters.action, iif(eq(parameters.action, 'pull'), format('{0} live into repo', parameters.env), iif(eq(parameters.action, 'push'), format('repo to {0}', parameters.env), format('{0} (repo vs live)', parameters.env)))) }}
    env:
      SPLUNK_STACK: $(SPLUNK_STACK)
      SPLUNK_SEARCH_HEAD: $(SPLUNK_SEARCH_HEAD)
      STACK_TOKEN: $(ACS_TOKEN)
  - ${{ if eq(parameters.action, 'pull') }}:
      - script: python "$(Pipeline.Workspace)/tools/pipeline/open_pr.py" ${{ parameters.env }}
        displayName: Open a pull request with the ${{ parameters.env }} settings
        workingDirectory: $(Pipeline.Workspace)/config
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
