parameters:
  - name: env
    type: string
  - name: action
    type: string
  - name: types
    type: string
    default: all
  - name: names
    type: string
    default: all
  - name: delete
    type: boolean
    default: false

steps:
  - checkout: self
    path: config
    persistCredentials: ${{ eq(parameters.action, 'pull') }}
  - checkout: tools
    path: tools
  - task: UsePythonVersion@0
    displayName: Select Python 3.13
    inputs:
      versionSpec: "3.13"
  - ${{ if eq(parameters.action, 'pull') }}:
      - script: python "$(Pipeline.Workspace)/tools/pipeline/open_pr.py" branch
        displayName: Check out the pull branch for this run
        workingDirectory: $(Pipeline.Workspace)/config
  - script: python "$(Pipeline.Workspace)/tools/acs_config.py" ${{ parameters.action }} ${{ parameters.env }} --dir "$(Pipeline.Workspace)/config" --types "${{ parameters.types }}" --names "${{ parameters.names }}" ${{ iif(parameters.delete, '--delete', '') }}
    displayName: ${{ iif(eq(parameters.action, 'plan'), format('Plan {0} (repo vs live)', parameters.env), iif(eq(parameters.action, 'pull'), format('Pull {0} live into repo', parameters.env), format('Push repo to {0}', parameters.env))) }}
    env:
      SPLUNK_STACK: $(SPLUNK_STACK)
      SPLUNK_SEARCH_HEAD: $(SPLUNK_SEARCH_HEAD)
      STACK_TOKEN: $(ACS_TOKEN)
  - ${{ if eq(parameters.action, 'pull') }}:
      - script: python "$(Pipeline.Workspace)/tools/pipeline/open_pr.py" changes
        displayName: Show ${{ parameters.env }} objects created, changed or deleted by this pull
        workingDirectory: $(Pipeline.Workspace)/config
      - script: python "$(Pipeline.Workspace)/tools/pipeline/open_pr.py" publish ${{ parameters.env }}
        displayName: Publish ${{ parameters.env }} settings as a pull request
        workingDirectory: $(Pipeline.Workspace)/config
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
