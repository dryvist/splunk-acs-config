# Pull requests, scheduled runs and read-only runs only plan every environment.
# A pull run reads every environment in parallel, then one job writes them in order to acs-pull/<build id>
# and opens one pull request.
# After the plan, a push run and a run on merge to main add a Push stage per environment
# (creates and updates) and, when delete is true, a Delete stage. These stages run only when someone selects
# Run stage.
parameters:
  - name: pool
    type: object
    default:
      vmImage: ubuntu-latest
  - name: environments
    type: object
    default: []
  - name: environment
    type: string
    default: all
  - name: action
    type: string
    default: push
    values:
      - pull
      - push
  # true runs only the plan, with no write jobs.
  - name: readOnly
    type: boolean
    default: true
  - name: types
    type: string
    default: all
  - name: names
    type: string
    default: all
  - name: delete
    type: boolean
    default: false
  - name: check
    type: boolean
    default: false

stages:
  - stage: plan
    displayName: ${{ iif(and(eq(parameters.action, 'pull'), not(parameters.readOnly), notIn(variables['Build.Reason'], 'PullRequest', 'Schedule')), 'Read live', 'Plan (read-only)') }}
    jobs:
      - ${{ each env in parameters.environments }}:
          - ${{ if in(parameters.environment, 'all', env) }}:
              - ${{ if not(and(eq(parameters.action, 'pull'), not(parameters.readOnly), notIn(variables['Build.Reason'], 'PullRequest', 'Schedule'))) }}:
                  - job: plan_${{ replace(env, '-', '_') }}
                    displayName: Plan ${{ env }}
                    pool: ${{ parameters.pool }}
                    variables:
                      - group: splunk-${{ env }}
                    steps:
                      - template: acs-config-steps.yml
                        parameters:
                          env: ${{ env }}
                          action: plan
                          check: ${{ parameters.check }}
                          types: ${{ parameters.types }}
                          names: ${{ parameters.names }}
              - ${{ else }}:
                  - job: read_${{ replace(env, '-', '_') }}
                    displayName: Read ${{ env }} live
                    pool: ${{ parameters.pool }}
                    variables:
                      - group: splunk-${{ env }}
                    steps:
                      - template: acs-config-steps.yml
                        parameters:
                          env: ${{ env }}
                          action: fetch
                          types: ${{ parameters.types }}
                          names: ${{ parameters.names }}
      - ${{ if and(eq(parameters.action, 'pull'), not(parameters.readOnly), notIn(variables['Build.Reason'], 'PullRequest', 'Schedule')) }}:
          - job: pull
            displayName: Pull ${{ parameters.environment }} into one pull request
            dependsOn:
              - ${{ each env in parameters.environments }}:
                  - ${{ if in(parameters.environment, 'all', env) }}:
                      - read_${{ replace(env, '-', '_') }}
            pool: ${{ parameters.pool }}
            steps:
              - template: acs-config-steps.yml
                parameters:
                  env: ${{ parameters.environment }}
                  action: pull
                  types: ${{ parameters.types }}
                  names: ${{ parameters.names }}
  - ${{ if or(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), and(eq(parameters.action, 'push'), not(parameters.readOnly), notIn(variables['Build.Reason'], 'PullRequest', 'Schedule'))) }}:
      - ${{ each env in parameters.environments }}:
          - ${{ if in(parameters.environment, 'all', env) }}:
              - stage: push_${{ replace(env, '-', '_') }}
                displayName: Push ${{ env }} (optional, run by hand)
                trigger: manual
                jobs:
                  - deployment: push
                    displayName: Push ${{ env }} creates and updates
                    pool: ${{ parameters.pool }}
                    environment: splunk-${{ env }}
                    variables:
                      - group: splunk-${{ env }}
                    strategy:
                      runOnce:
                        deploy:
                          steps:
                            - template: acs-config-steps.yml
                              parameters:
                                env: ${{ env }}
                                action: push
                                types: ${{ parameters.types }}
                                names: ${{ parameters.names }}
              - ${{ if parameters.delete }}:
                  - stage: delete_${{ replace(env, '-', '_') }}
                    displayName: Delete ${{ env }} live-only objects (optional, run by hand; deleting an index deletes its data)
                    trigger: manual
                    jobs:
                      - deployment: delete
                        displayName: Delete ${{ env }} live-only objects
                        pool: ${{ parameters.pool }}
                        environment: splunk-${{ env }}
                        variables:
                          - group: splunk-${{ env }}
                        strategy:
                          runOnce:
                            deploy:
                              steps:
                                - template: acs-config-steps.yml
                                  parameters:
                                    env: ${{ env }}
                                    action: push
                                    types: ${{ parameters.types }}
                                    names: ${{ parameters.names }}
                                    delete: true
