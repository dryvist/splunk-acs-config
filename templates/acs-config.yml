# Pull requests always run plan for every environment.
# A pull run commits every environment to one branch, acs-pull/<build id>, and opens one pull request.
parameters:
  - name: pool
    type: object
    default:
      vmImage: ubuntu-latest
  - name: environments
    type: object
    default: []
  - name: environment
    type: string
    default: all
  - name: action
    type: string
    default: plan
    values:
      - plan
      - pull
      - push
  - name: types
    type: string
    default: all
  - name: names
    type: string
    default: all
  - name: delete
    type: boolean
    default: false

jobs:
  - ${{ each env in parameters.environments }}:
      - ${{ if in(parameters.environment, 'all', env) }}:
          - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
              - job: plan_${{ replace(env, '-', '_') }}
                displayName: Plan ${{ env }}
                pool: ${{ parameters.pool }}
                variables:
                  - group: splunk-${{ env }}
                steps:
                  - template: acs-config-steps.yml
                    parameters:
                      env: ${{ env }}
                      action: plan
          - ${{ elseif eq(parameters.action, 'push') }}:
              - deployment: push_${{ replace(env, '-', '_') }}
                displayName: Push ${{ env }}
                pool: ${{ parameters.pool }}
                environment: splunk-${{ env }}
                variables:
                  - group: splunk-${{ env }}
                strategy:
                  runOnce:
                    deploy:
                      steps:
                        - template: acs-config-steps.yml
                          parameters:
                            env: ${{ env }}
                            action: push
                            types: ${{ parameters.types }}
                            names: ${{ parameters.names }}
                            delete: ${{ parameters.delete }}
          - ${{ else }}:
              - job: ${{ parameters.action }}_${{ replace(env, '-', '_') }}
                displayName: ${{ iif(eq(parameters.action, 'pull'), format('Pull {0}', env), format('Plan {0}', env)) }}
                # Pull jobs run in reverse name order (prod before nonprod) on one shared branch.
                ${{ if eq(parameters.action, 'pull') }}:
                  dependsOn:
                    - ${{ each other in parameters.environments }}:
                        - ${{ if and(gt(other, env), in(parameters.environment, 'all', other)) }}:
                            - pull_${{ replace(other, '-', '_') }}
                pool: ${{ parameters.pool }}
                variables:
                  - group: splunk-${{ env }}
                steps:
                  - template: acs-config-steps.yml
                    parameters:
                      env: ${{ env }}
                      action: ${{ parameters.action }}
                      types: ${{ parameters.types }}
                      names: ${{ parameters.names }}
